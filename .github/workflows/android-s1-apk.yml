name: Android debug APK (S1 / release 1.0)

# STORE FIRST — S1 spike only. Builds the current app (index.html, unchanged logic) without CDNs,
# wraps it in Capacitor 8 and publishes a DEBUG APK as a downloadable artifact.
# Talks only to the TEST Supabase project (nextrep-f5-test). No deployment anywhere.
on:
  push:
    branches: [spike/capacitor-android, release/1.0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s1-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXTREP_SUPABASE_URL: https://qnyjrvoudyjxvitazclo.supabase.co   # nextrep-f5-test (test project)
  NEXTREP_SUPABASE_KEY: sb_publishable_m-a9ngkx_UsLw1IglNj-HQ_JdpAqRmy # publishable key of that test project
  NEXTREP_TARGET: native

jobs:
  tests:
    name: Automated tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: F1 split identity (src/app/ = baseline app script, byte for byte)
        run: node tools/check-split.mjs
      - name: Install test dependencies
        working-directory: tests
        run: npm ci
      - name: Run tests
        working-directory: tests
        run: npm test

  e2e:
    name: E2E + visual (Chromium, offline)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the visual test builds the reference commit (a2b9ca0) next to this one
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          npm ci
          cd tests && npm ci
      - name: Install Chromium for Playwright
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: E2E flow and visual comparison
        working-directory: tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-diffs-run${{ github.run_number }}
          path: tests/e2e/.out/
          retention-days: 14

  apk:
    name: Build debug APK
    runs-on: ubuntu-24.04
    needs: [tests, e2e]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build web app without CDNs
        env:
          NEXTREP_BUILD_ID: __native-s1-run${{ github.run_number }}
        run: node tools/build-web.mjs
      - name: Check build output (no CDN, test Supabase only)
        run: |
          ! grep -RqE 'cdn\.tailwindcss\.com|esm\.sh|unpkg\.com|fonts\.googleapis\.com' dist/index.html dist/assets/*.js dist/assets/*.css
          ! grep -Rq 'pyhhvbqcjhpulrmqiguz' dist
          grep -q 'qnyjrvoudyjxvitazclo' dist/assets/app.js
          cat dist/build-info.json
      - name: Copy web app into the Android project
        run: npx cap sync android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK (preinstalled on the runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" | tail -20
      - name: Gradle assembleDebug
        working-directory: android
        env:
          NEXTREP_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle.log; then
            # surface the failure as public annotations (readable without downloading logs)
            msg=$( { sed -n '/What went wrong/,/\* Try:/p' gradle.log | head -25; grep -E "^e: |error:|ERROR:" gradle.log | head -15; } | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=gradle::${msg}"
            exit 1
          fi
      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/nextrep-s1-run${{ github.run_number }}.apk"
          cp dist/build-info.json out/
          sha256sum out/*.apk | tee out/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nextrep-s1-apk-run${{ github.run_number }}
          path: out/
          retention-days: 30
          if-no-files-found: error
