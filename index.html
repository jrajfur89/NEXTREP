<!-- NEXTREP_APP: the app (src/app/, src/engine/) and its CSS are added here by tools/build-web.mjs -->

<script>
  // NEXTREP app updates (no Service Worker — if one is ever needed, it will be a separate sw.js).
  //
  // Every build carries its own id in <meta name="nextrep-build">. On launch, whenever the
  // installed app comes back to the foreground, when the connection returns, and every 30
  // minutes, index.html is fetched straight from the server (cache: no-store) and the ids are
  // compared. A different id = a new deployment → the page reloads into the new version.
  // Never reloads during an open workout (its state lives only in memory) — the update is applied
  // right after the workout screen closes. A sessionStorage guard prevents reload loops.
  // localStorage is never read, changed or cleared here.
  (function () {
    var meta = document.querySelector('meta[name="nextrep-build"]');
    var BUILD = meta ? meta.getAttribute("content") : "";
    var lastCheck = 0;
    var pending = false;
    var reloading = false;

    function applyUpdate(newBuild) {
      if (reloading) return;
      if (window.__nextrepBusy) { pending = true; return; }
      var guard = "nextrep_update_reload_" + newBuild;
      try {
        if (sessionStorage.getItem(guard)) return; // already reloaded once for this build
        sessionStorage.setItem(guard, "1");
      } catch (e) {}
      reloading = true;
      location.reload();
    }

    function checkForUpdate(force) {
      if (!BUILD || BUILD.indexOf("__") === 0) return; // unbuilt source copy
      if (reloading || (typeof navigator.onLine === "boolean" && !navigator.onLine)) return;
      var now = Date.now();
      if (!force && now - lastCheck < 15000) return;
      lastCheck = now;
      fetch("./index.html?nextrep-build-check=" + now, { cache: "no-store" })
        .then(function (res) { return res.ok ? res.text() : null; })
        .then(function (html) {
          if (!html) return;
          var m = html.match(/<meta name="nextrep-build" content="([^"]+)"/);
          if (m && m[1] && m[1] !== BUILD && m[1].indexOf("__") !== 0) applyUpdate(m[1]);
        })
        .catch(function () {}); // offline / server error: keep running the loaded version
    }

    window.addEventListener("load", function () { setTimeout(function () { checkForUpdate(true); }, 1500); });
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") checkForUpdate(false);
    });
    window.addEventListener("pageshow", function (e) { if (e.persisted) checkForUpdate(true); });
    window.addEventListener("online", function () { checkForUpdate(true); });
    window.addEventListener("nextrep-idle", function () { if (pending) { pending = false; checkForUpdate(true); } });
    setInterval(function () { if (document.visibilityState === "visible") checkForUpdate(false); }, 30 * 60 * 1000);
  })();
</script>
